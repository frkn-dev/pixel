log_level = "info"
log_path = "/var/log/nginx/pixel.log"
offset_path = "/var/lib/pixel-agent/offset.dat"
snapshot_path = "/var/lib/pixel-agent/metrics.snapshot"
geoip_db = "/usr/share/GeoIP/GeoLite2-Country.mmdb"
admin_listen = "0.0.0.0"
admin_port = 9102
cors_origins = ["http://localhost:8080", "https://frkn.org", "https://api.frkn.org"]
poll_interval_sec = 30
flush_interval_sec = 300
snapshot_interval_sec = 300
bucket_minutes = 5
# Keep ~90 days of history so the admin UI can show ranges up to 3 months.
retention_hours = 2160
max_points = 30000
retention_seconds = 7776000
